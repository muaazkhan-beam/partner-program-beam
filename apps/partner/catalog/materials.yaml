items:
  - slug: where-beam-fits
    kind: material
    title: Where Beam fits
    format: one-pager
    summary: What Beam is, when it gets in, what it is not, and where it does not go. One page for an internal sponsor.
    body: |
      What Beam is
      Beam is the intelligence layer that runs the process across systems, with a graph that must start and finish, evals on the steps that matter, and an audit log. The user stays in the screen they already live in. Beam writes back.

      When Beam gets in
      Use this when the process spans two or more systems, is exception-heavy, or sits on a 15–30 year ERP the client will not rip out. A strong first workflow is frequent enough to matter, contains manual handoffs or re-keying, crosses two or more systems, and has exceptions that prevent simple rules-based automation.

      What Beam is not
      EPM is a planning and data-model layer. Beam is not that database. We are not a process-mining suite and not a data-lake vendor. We do not sprinkle assistants on unchanged processes.

      And where it doesn't
      Do not pick a fight inside a clean, single-module S/4 workflow the ERP already does well. If the client has no API and no export path, say so early. Pause when there is no API or export path, no accountable process owner, no representative test data, or no measurable operational outcome. Also escalate expectations of unsupervised high-risk action. Start read-first and recommend-first. The agent can gather evidence, prepare a decision, and propose an action while an accountable person approves high-risk steps such as payments, regulated decisions, or material client communications.

      Not yet published
      Pricing, deal registration, regional deployment, support coverage and access are pending Beam review. Ask Beam from the answer you are stuck on.
    status: pending
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded]
    claimState: approved
    reviewer: Partner Success
    requestBeamLabel: Request Beam for the reviewed note before forwarding.
