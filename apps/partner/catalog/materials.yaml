  - slug: security-compliance-pack
    kind: material
    title: Security and compliance pack
    format: pack
    summary: The security, privacy and continuity documents Beam can share with a client's security team, listed as printed. Reviewed copies are issued per client and deployment.
    body: |
      Documents in the pack, as printed on each:

      Information Security Policy · v2.0 · 23 Jun 2025 · 10 pages
      Data Privacy Policy · v2.0 · 1 Dec 2024 · 5 pages
      GDPR Manual · version and date not printed on the document; confirm with Beam · 11 pages
      Data and Record Retention Policy · v2.0 · 1 Jan 2025 · 5 pages
      Backup Policy and Procedure · v1.0 · 1 Dec 2023 · 4 pages
      Business Continuity and Disaster Recovery Policy · v3.0 · 1 Dec 2025 as printed · 8 pages
      Information Security Incident Management Policy and Procedure · v2.0 · 1 Jan 2025 · 22 pages
      Access Control Policy · v2.0 · 1 Dec 2024 · 6 pages

      Request the reviewed copy for the client and deployment under discussion. Do not describe any of these to a client as a certification, a hosting commitment, or a residency guarantee; the approved evidence must match the named deployment.
