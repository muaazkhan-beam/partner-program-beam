  - slug: who-we-are
    kind: material
    title: Who we are
    format: one-pager
    summary: What Beam does, how Beam contracts, and who to contact. Registered details on request.
    body: |
      Beam contracts through a regional legal entity chosen per engagement. The registered company, address and company number are confirmed by Beam for each client; request them before drafting a contract or answering a security questionnaire.

      Beam's job is the platform, the agent factory, and the production eval loop. The partner's job is the client, the operating model, the humans in the delivery center, and the transformation story.

      Partner contact: the support owner shown in this workspace.
