    href: /faq
  - id: beachhead
    title: First service workflow
    framing: beachhead
    summary: Select one exception-heavy process, map its controls, validate a shadow workflow, and agree measurable service outcomes.
    action: Start a client opportunity
    href: /requests
  - id: clearance
    title: Control and delivery readiness
    framing: clearance
    summary: Use reviewed security, sovereignty, human-approval, and independence answers. Route restricted claims to Beam.
    action: Open the delivery FAQ
    href: /faq
steps:
  - title: Qualify the client process
    detail: Confirm the client outcome, operational volume, current service model, systems, and accountable stakeholders.
  - title: Map controls and exceptions
    detail: Use the operating diagnostic to capture handoffs, approvals, regulatory obligations, and failure paths.
  - title: Show a shadow workflow
    detail: Request a Beam-run demonstration, then validate the process with representative test data and human review.
  - title: Agree service outcomes
    detail: Define the SLA, evaluation plan, control evidence, and first production outcome with Beam.
