    title: Risk & delivery readiness
    framing: clearance
    summary: Use approved deployment and independence proof. Escalate restricted questions to Beam.
    action: Open risk FAQ
    href: /faq
steps:
  - title: Qualify the client
    detail: Confirm ICP, urgency, and that this is not a single-module ERP or EPM problem.
  - title: Run a 60-minute diagnostic
    detail: Use the operating-diagnostic method with department heads. Beam FDE joins the first two.
  - title: Show a shadow workflow
    detail: Request a vertical demo, then a shadow environment on their process with test data.
  - title: Agree success criteria
    detail: Write the first fees-at-risk definition with Beam. Do not invent commercial numbers in the room.
