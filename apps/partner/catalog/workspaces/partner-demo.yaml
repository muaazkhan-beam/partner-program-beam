tracks:
  - id: layer
    title: Position the opportunity
    framing: layer
    summary: Explain where Beam fits alongside the client's existing systems and turn the business outcome into an account hypothesis.
    action: Open the competitive FAQ
    href: /faq
  - id: beachhead
    title: Select the first workflow
    framing: beachhead
    summary: Name one exception-heavy process, run a diagnostic, agree success criteria, and request a shadow demo.
    action: Start a client opportunity
    href: /requests
  - id: clearance
    title: Clear delivery readiness
    framing: clearance
    summary: Use approved deployment and governance answers, and route restricted questions to Beam.
    action: Open the delivery FAQ
    href: /faq
steps:
  - title: Qualify the client
    detail: Confirm the outcome, urgency, stakeholders, and why the process needs an agentic operating layer.
  - title: Map the workflow
    detail: Use the operating diagnostic to find handoffs, exceptions, and the systems involved.
  - title: Show a shadow workflow
    detail: Request a Beam-run demo, then validate the client process safely with representative test data.
  - title: Agree success criteria
    detail: Define the first production outcome, evaluation plan, and expansion path with Beam.
