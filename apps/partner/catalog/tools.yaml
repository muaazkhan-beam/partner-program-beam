    contentClass: shared-partner-safe
    audience: technical
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded]
    claimState: approved
    reviewer: Partner Success
  - slug: platform-demo
    kind: tool
    title: Platform demo path
    group: Prove
