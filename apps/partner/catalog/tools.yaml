items:
  - slug: partner-cli
    kind: tool
    title: Partner CLI
    group: Start
    summary: Start partner-safe work from Codex, Claude, or Beam Prism.
    body: Copy the workspace prompt into your preferred agent. The Partner CLI keeps discovery inside reviewed tools, materials, and requests for this workspace.
    contentClass: shared-partner-safe
    audience: technical
    forwardable: false
    allowedBrandModes: [beam-standard, co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
  - slug: partner-faq
    kind: tool
    title: Partner FAQ
    group: Sell
    summary: Answers for SAP, Oracle, ServiceNow, Anaplan, brand, and roles.
    body: Read, search, and copy into an internal email. Partners cannot publish answers.
    href: /faq
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: false
    allowedBrandModes: [beam-standard, co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
    requestBeamLabel: Request Beam to publish or change an answer.
  - slug: competitive-battlecards
    kind: tool
    title: Competitive battlecards
    group: Sell
    summary: Incumbent vs Beam, and when to walk away.
    body: Use before the internal "why this crew" meeting. Do not pick a fight inside a clean single-module S/4 workflow.
    href: /faq
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: false
    allowedBrandModes: [beam-standard, co-branded]
    claimState: approved
    reviewer: Partner Success
  - slug: gcc-account-qualifier
    kind: tool
    title: GCC account qualifier
    group: Sell
    summary: ICP rules, hard exclusions, and lanes for a target list.
    body: Paste a target list into the documented gcc-account-qualifier workflow. Beam staff or an approved partner user runs the skill. Partners do not get GTM Core folders.
    href: https://core.beam.ai/skills/gcc-account-qualifier
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: false
    allowedBrandModes: [beam-standard, co-branded]
    claimState: approved
    reviewer: Partner Success
    requestBeamLabel: Request Beam to run the qualifier on a list.
  - slug: call-prep
    kind: tool
    title: Call prep (partner mode)
    group: Sell
    summary: Joint RACI and complementary capabilities for the next meeting.
    body: Follow the call-prep skill in partner mode. Optional Beam-run.
    href: https://core.beam.ai/skills/call-prep
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: false
    allowedBrandModes: [beam-standard, co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
  - slug: materials-library
    kind: tool
    title: Materials library
    group: Sell
    summary: Intro deck, one-pager, and proof pack with audience tags.
    body: Download only reviewed records. Request new materials instead of forwarding drafts.
