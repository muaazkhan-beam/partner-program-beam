items:
  - slug: why-not-sap
    kind: faq
    title: Why would a client buy Beam instead of SAP / Oracle / ServiceNow / Workday AI?
    summary: Those products automate work inside their own object model.
    body: Those products automate work inside their own object model. Clients still have email, shared drives, legacy ERPs, SMS, country-specific portals, and exceptions the incumbent assistant cannot close. Beam is the intelligence layer that runs the process across systems, with a graph that must start and finish, evals on the steps that matter, and an audit log. The user stays in the screen they already live in. Beam writes back. Use this when the process spans two or more systems, is exception-heavy, or sits on a 15–30 year ERP the client will not rip out. Do not pick a fight inside a clean, single-module S/4 workflow the ERP already does well.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
  - slug: vs-epm
    kind: faq
    title: How is this different from Anaplan / OneStream / other EPM?
    summary: EPM is a planning layer. Beam is not that database.
    body: EPM is a planning and data-model layer. If the client’s actual problem is "we have no planning model", that is an EPM deal. If the problem is "70 people in a room judging invoices because the ERP’s three-way match dies on exceptions", that is a Beam deal. They can coexist. Beam pulls what it needs, acts, and does not keep a second warehouse by default.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded]
    claimState: approved
    reviewer: Partner Success
  - slug: data-integration
    kind: faq
    title: You do not store the data. So how do you work?
    summary: We integrate, pull what is actionable, act, and discard the rest.
    body: We integrate through a custom integration builder and an out-of-the-box catalog. We pull, decide if it is actionable, act, and discard what we do not need. We are not a process-mining suite and not a data-lake vendor. If the client has no API and no export path, say so early.
    contentClass: shared-partner-safe
    audience: technical
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded]
    claimState: approved
    reviewer: Partner Success
  - slug: first-process-fit
    kind: faq
    title: What makes a strong first workflow?
    summary: Start with repeatable, exception-heavy work that crosses systems and has a measurable outcome.
    body: A strong first workflow is frequent enough to matter, contains manual handoffs or re-keying, crosses two or more systems, and has exceptions that prevent simple rules-based automation. It also needs a named process owner, a usable API or export path, representative test data, and a baseline the client agrees to measure. Start with one narrow beachhead rather than an end-to-end transformation promise.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
  - slug: when-to-walk-away
    kind: faq
    title: When should we not pursue an opportunity?
    summary: Walk away when the problem is already solved by one module, cannot be accessed, or has no accountable owner.
    body: Do not force a Beam deal when a clean single-module ERP or EPM workflow already solves the problem well. Pause when there is no API or export path, no accountable process owner, no representative test data, or no measurable operational outcome. Also escalate expectations of unsupervised high-risk action. A vague innovation brief is not yet a qualified first workflow.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
  - slug: human-approval
    kind: faq
    title: Where does human approval sit?
    summary: Beam can prepare and recommend; accountable people retain high-risk approvals.
    body: Start read-first and recommend-first. The agent can gather evidence, prepare a decision, and propose an action while an accountable person approves high-risk steps such as payments, regulated decisions, or material client communications. The exact approval point is a workflow design decision. Put it into the audit trail and evaluate both the recommendation and the handoff.
    contentClass: shared-partner-safe
    audience: technical
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded]
    claimState: approved
    reviewer: Partner Success
  - slug: deployment-ksa-kuwait
    kind: faq
    title: What does deployment look like in Saudi Arabia or Kuwait?
    summary: Restricted. Do not state residency or on-prem as a generic promise.
    body: Do not state regional residency, on-prem, private-networking, or government readiness as a generic promise.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: false
    allowedBrandModes: [beam-standard, co-branded]
    claimState: restricted
    restrictedReason: Regional deployment and sovereignty claims need commercial and security approval.
    requestBeamLabel: Request Beam for a deployment review.
    reviewer: Partner Success
  - slug: not-another-ai-tool
    kind: faq
    title: Every GM already bought a small AI tool. Why will this not be another one?
    summary: We pick one high-volume chain and put it into production with evals.
    body: We do not sprinkle assistants on unchanged processes. We pick one high-volume back-office chain, agree success criteria, put it into production with evals and exception paths, and only then expand. Local tool sprawl with zero upside is the default. The counter is a process-bank, a ranked first wave, and fees that can wait on proof.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
  - slug: partner-vs-beam
    kind: faq
    title: Why Beam instead of building this ourselves?
    summary: Partner owns the client and delivery center. Beam owns the factory.
    body: Priorities, not talent, are why in-house platform attempts stall. Beam’s job is the platform, the agent factory, and the production eval loop. The partner’s job is the client, the operating model, the humans in the delivery center, and the transformation story. We are not a rent-a-brand, and Beam is not staff-aug hiding in a partner logo.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: false
    allowedBrandModes: [co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
  - slug: brand-shapes
    kind: faq
    title: Do we expose the Beam brand?
    summary: Three legal shapes only.
    body: Partner-fronted / powered by Beam for brand-sensitive managed services. Joint when the client wants the technology vendor in the room. Beam-fronted, partner-introduced for a technical buyer. Do not invent a fourth shape on the call.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: false
    allowedBrandModes: [beam-standard, co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
  - slug: how-we-make-money
    kind: faq
    title: How do we make money?
    summary: High-level shapes only. Numbers stay in a staff annex.
    body: Typical shapes are co-sell, reseller / white-label, co-delivery with Beam FDEs, outcome-tied client fees, then license. JV-on-the-core-product is how conversations die.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: false
    allowedBrandModes: [beam-standard, co-branded]
    claimState: approved
    reviewer: Partner Success
    requestBeamLabel: Request Beam for the staff-approved commercial annex. Do not quote unpublished pricing.
