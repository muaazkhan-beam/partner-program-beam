  - slug: first-engagement
    kind: faq
    title: What does the first engagement look like?
    summary: Qualify, diagnose, shadow, produce, then expand.
    body: Qualify the account and walk away when it is EPM or a single-module ERP assistant. Take an outside-in view and process interviews. Rank a first wave and agree success criteria. Shadow one process with test data. Produce with evals, exception paths, and an audit log. Expand along the value chain. License after value is visible.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
  - slug: measuring-success
    kind: faq
    title: How do we define and measure success?
    summary: Agree the baseline, operational outcome, guardrails, and evaluation method before production.
    body: Define success for the named process before production. Capture the current baseline, select an operational outcome such as cycle time, throughput, exception resolution, or quality, document the human approval points, and agree how the workflow will be evaluated. Do not invent a universal ROI percentage. Beam and the partner should write the first success criteria together and use the result to decide whether to expand.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
  - slug: audit-independence
    kind: faq
    title: What if we are an audit firm and independence is messy?
    summary: Flag early. Beam does not give legal advice.
    body: "Use the checklist: named client, service line, whether Beam would be in the attest perimeter, who contracts, who hosts data, and whether white-label reduces conflict optics. Beam does not give legal advice. PwC risk must clear the motion."
    contentClass: workspace-only
    audience: partner-internal
    forwardable: false
    allowedBrandModes: [co-branded, partner-fronted]
    claimState: restricted
    restrictedReason: Independence is a risk conversation, not a published legal answer.
    requestBeamLabel: Request Beam and loop partner risk. Do not treat this FAQ as legal advice.
    reviewer: Partner Success
  - slug: working-agent
    kind: faq
    title: Can we see a working agent, not a slide?
    summary: Yes. Request a vertical demo, then a shadow on their process.
    body: Request a vertical demo (order-to-cash, invoice exceptions, screening) and, for the first joint client, a shadow workflow on their process. Do not promise a same-day custom demo on an unscoped process.
    contentClass: shared-partner-safe
    audience: technical
    forwardable: false
    allowedBrandModes: [beam-standard, co-branded]
    claimState: approved
    reviewer: Partner Success
    requestBeamLabel: Request a vertical demo or shadow workflow.
