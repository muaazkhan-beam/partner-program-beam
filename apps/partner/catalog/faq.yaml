    kind: faq
    title: How do we register and protect a partner-sourced opportunity?
    summary: Pending. Deal-registration ownership and protection rules are being finalized.
    body: This answer is pending commercial approval. Do not promise opportunity protection, exclusivity, referral credit, or a registration window before Beam confirms the deal-specific motion.
