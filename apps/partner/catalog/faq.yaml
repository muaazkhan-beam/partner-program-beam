  - slug: accuracy
    kind: faq
    title: How do you keep accuracy from decaying?
    summary: Production feedback becomes clustered training data.
    body: Production feedback (thumbs, failed code nodes, low evals) becomes training data. Problems are clustered. One cluster is trained at a time, then regression-tested against the others.
    contentClass: shared-partner-safe
    audience: technical
    forwardable: true
    allowedBrandModes: [beam-standard, co-branded]
    claimState: approved
    reviewer: Partner Success
  - slug: leadership-pack
    kind: faq
    title: What should I send my leadership tomorrow?
    summary: Four artifacts, in this order.
    body: Two-page where Beam fits. Joint-motion one-pager. One approved proof pack, sector-matched. The one-workflow playbook with a named candidate process if you have one. Not a 40-slide follow-up, and not an internal Iris admin screenshot.
    contentClass: shared-partner-safe
    audience: partner-internal
    forwardable: false
    allowedBrandModes: [co-branded, partner-fronted]
    claimState: approved
    reviewer: Partner Success
